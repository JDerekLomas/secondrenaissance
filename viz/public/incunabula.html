<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Spread of Printing: 1450–1500</title>
    <meta name="description" content="Watch printing technology spread across Europe in the 50 years after Gutenberg. An interactive map of the incunabula era.">

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #fdfcf9;
            color: #1a1612;
            min-height: 100vh;
        }

        /* Header */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            border-bottom: 1px solid #e8e4dc;
            background: #fdfcf9;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-bar a {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.1em;
            color: #666;
            text-decoration: none;
        }

        .header-bar a:hover { color: #9e4a3a; }

        .header-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 20px;
            font-weight: 500;
        }

        /* Timeline control bar */
        .timeline-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 16px 24px;
            background: #f8f6f2;
            border-bottom: 1px solid #e8e4dc;
        }

        .year-display {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 48px;
            font-weight: 500;
            color: #1a1612;
            min-width: 100px;
        }

        .slider-container {
            flex: 1;
            max-width: 400px;
        }

        #year-slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: #e0dcd4;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        #year-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #9e4a3a;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            font-size: 9px;
            color: #999;
        }

        .controls {
            display: flex;
            gap: 8px;
        }

        .controls button {
            padding: 8px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid #e8e4dc;
            background: #fff;
            color: #666;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .controls button:hover { background: #f0ebe5; }

        #play-btn {
            padding: 8px 20px;
            background: #9e4a3a;
            color: #fff;
            border: none;
        }

        #play-btn:hover { background: #b5574a; }
        #play-btn.active { background: #7a3a2e; }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 12px;
            color: #666;
        }

        .stat-value {
            font-weight: 600;
            color: #9e4a3a;
        }

        /* Main 3-column layout */
        .main-container {
            display: grid;
            grid-template-columns: 320px 1fr 380px;
            height: calc(100vh - 130px);
            overflow: hidden;
        }

        @media (max-width: 1200px) {
            .main-container {
                grid-template-columns: 280px 1fr 320px;
            }
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
                height: auto;
            }
            .events-column, .map-column, .books-column {
                height: 500px;
            }
        }

        /* Events column (left) */
        .events-column {
            border-right: 1px solid #e8e4dc;
            overflow-y: auto;
            background: linear-gradient(180deg, #fffbf0 0%, #fdfcf9 100%);
        }

        .column-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e8e4dc;
            background: inherit;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .column-header h2 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 18px;
            font-weight: 500;
            color: #1a1612;
        }

        .column-header .subtitle {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }

        .events-list {
            padding: 0;
        }

        .event-item {
            padding: 16px 20px;
            border-bottom: 1px solid #f0e8d8;
            transition: background 0.15s;
        }

        .event-item:hover {
            background: #fff8e8;
        }

        .event-item.current {
            background: #fff8e8;
            border-left: 3px solid #d4a017;
        }

        .event-item.faded {
            opacity: 0.5;
        }

        .event-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 6px;
        }

        .event-year {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 20px;
            font-weight: 600;
            color: #9e4a3a;
        }

        .event-title {
            font-weight: 600;
            font-size: 13px;
            color: #1a1612;
        }

        .event-type {
            display: inline-block;
            font-size: 8px;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-left: auto;
        }

        .event-type.milestone { background: #e8f0f5; color: #5078a0; }
        .event-type.publication { background: #e8f5e8; color: #3d6d3d; }
        .event-type.expansion { background: #fce8e8; color: #9e4a3a; }
        .event-type.crisis { background: #f5e0c8; color: #8b5a2b; }
        .event-type.innovation { background: #f0e8f5; color: #6b4d8a; }
        .event-type.foundation { background: #e8f0e8; color: #4a7c4a; }
        .event-type.migration { background: #f5f0e0; color: #7a6530; }

        .event-desc {
            font-size: 12px;
            line-height: 1.6;
            color: #555;
        }

        .no-events {
            padding: 40px 20px;
            text-align: center;
            color: #999;
            font-size: 13px;
        }

        /* Map column (center) */
        .map-column {
            display: flex;
            flex-direction: column;
            background: #f0ebe5;
            position: relative;
        }

        #map {
            flex: 1;
            width: 100%;
            cursor: grab;
        }

        #map:active {
            cursor: grabbing;
        }

        .map-legend {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 10px 16px;
            background: rgba(253, 252, 249, 0.95);
            border-top: 1px solid #e8e4dc;
            font-size: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #666;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .zoom-hint {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #888;
            background: rgba(255,255,255,0.9);
            padding: 4px 10px;
            border-radius: 4px;
            pointer-events: none;
        }

        .city-node {
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .city-node:hover, .city-node.selected {
            filter: brightness(1.1);
            stroke-width: 3px;
        }

        .city-label {
            font-family: 'Inter', sans-serif;
            font-size: 9px;
            font-weight: 500;
            fill: #333;
            pointer-events: none;
        }

        .connection {
            fill: none;
            stroke: #9e4a3a;
            stroke-opacity: 0.4;
            stroke-width: 1.5;
            pointer-events: stroke;
            cursor: pointer;
        }

        .connection.notable {
            stroke: #d4a017;
            stroke-width: 2;
            stroke-opacity: 0.7;
        }

        .connection:hover {
            stroke-opacity: 0.9;
            stroke-width: 2.5;
        }

        /* Books column (right) */
        .books-column {
            border-left: 1px solid #e8e4dc;
            overflow-y: auto;
            background: #fff;
        }

        .filter-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .filter-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: #9e4a3a;
            color: #fff;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }

        .filter-tag button {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            opacity: 0.8;
        }

        .filter-tag button:hover { opacity: 1; }

        .book-list {
            padding: 0;
        }

        .book-item {
            padding: 14px 20px;
            border-bottom: 1px solid #f0ebe3;
            transition: background 0.15s;
            cursor: pointer;
        }

        .book-item:hover {
            background: #faf8f5;
        }

        .book-item.expanded {
            background: #f8f6f2;
            border-left: 3px solid #5078a0;
        }

        .book-item.highlighted {
            background: #fff8e8;
            border-left: 3px solid #d97706;
        }

        .book-item .year-city {
            font-size: 10px;
            font-weight: 500;
            color: #9e4a3a;
            margin-bottom: 3px;
        }

        .book-item .title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 14px;
            color: #1a1612;
            line-height: 1.3;
            margin-bottom: 4px;
        }

        .book-item .meta {
            font-size: 11px;
            color: #888;
        }

        .digital-indicator {
            display: inline-block;
            font-size: 9px;
            padding: 2px 6px;
            background: #e8f0f5;
            color: #5078a0;
            border-radius: 3px;
            margin-left: 8px;
            font-weight: 500;
        }

        .book-details {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e8e4dc;
        }

        .book-summary {
            font-size: 12px;
            line-height: 1.5;
            color: #444;
            margin-bottom: 12px;
            padding: 10px 12px;
            background: #fafafa;
            border-left: 3px solid #8b7355;
            border-radius: 0 4px 4px 0;
        }

        .digital-links {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .digital-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #5078a0;
            text-decoration: none;
            padding: 6px 10px;
            background: #e8f0f5;
            border-radius: 4px;
            transition: background 0.15s;
        }

        .digital-link:hover { background: #d0e0ea; }
        .digital-link::before { content: "📄"; }

        .no-digital {
            font-size: 11px;
            color: #999;
            font-style: italic;
        }

        .holdings-info {
            margin-top: 8px;
            font-size: 10px;
            color: #666;
        }

        .istc-link {
            display: inline-block;
            margin-top: 8px;
            font-size: 10px;
            color: #5078a0;
            text-decoration: none;
        }

        .istc-link:hover { text-decoration: underline; }

        .more-links {
            font-size: 10px;
            color: #666;
            font-style: italic;
            padding: 4px 0;
        }

        .no-books {
            padding: 40px 20px;
            text-align: center;
            color: #888;
            font-size: 13px;
        }

        .load-more {
            padding: 12px 20px;
            text-align: center;
            border-top: 1px solid #e8e4dc;
        }

        .load-more button {
            padding: 8px 24px;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 500;
            background: #f5f2ed;
            border: 1px solid #e8e4dc;
            border-radius: 4px;
            cursor: pointer;
        }

        .load-more button:hover { background: #ebe6de; }

        /* Tooltip */
        .tooltip {
            position: fixed;
            visibility: hidden;
            background: #fff;
            border: 1px solid #e8e4dc;
            border-radius: 8px;
            padding: 12px 16px;
            max-width: 250px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            pointer-events: none;
            z-index: 1000;
        }

        .tooltip h3 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 18px;
            color: #1a1612;
        }

        .tooltip .meta {
            font-size: 11px;
            color: #9e4a3a;
            margin-bottom: 6px;
        }

        .tooltip p {
            font-size: 12px;
            color: #666;
            line-height: 1.4;
        }

        .tooltip .click-hint {
            font-size: 10px;
            color: #999;
            margin-top: 8px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <a href="/blog">← RESEARCH</a>
        <div class="header-title">The Spread of Printing: 1450–1500</div>
        <a href="/printing-migrations.md">About →</a>
    </div>

    <div class="timeline-bar">
        <div class="year-display" id="year-display">1454</div>
        <div class="slider-container">
            <input type="range" id="year-slider" min="1454" max="1500" value="1454">
            <div class="slider-labels">
                <span>1454</span>
                <span>1470</span>
                <span>1485</span>
                <span>1500</span>
            </div>
        </div>
        <div class="controls">
            <button id="play-btn">▶ Play</button>
            <button id="reset-btn">Reset</button>
        </div>
        <div class="stats">
            <span><span class="stat-value" id="stat-cities">1</span> cities</span>
            <span><span class="stat-value" id="stat-books">0</span> books</span>
        </div>
    </div>

    <div class="main-container">
        <!-- Events column (left) -->
        <div class="events-column">
            <div class="column-header">
                <h2>Historical Events</h2>
                <div class="subtitle">Key moments in printing history</div>
            </div>
            <div class="events-list" id="events-list"></div>
        </div>

        <!-- Map column (center) -->
        <div class="map-column">
            <svg id="map"></svg>
            <div class="zoom-hint">Scroll to zoom · Drag to pan</div>
            <div class="map-legend">
                <div class="legend-item"><span class="legend-dot" style="background: #e8a838;"></span> Italy</div>
                <div class="legend-item"><span class="legend-dot" style="background: #5a9e5a;"></span> Germany</div>
                <div class="legend-item"><span class="legend-dot" style="background: #5078a0;"></span> France</div>
                <div class="legend-item"><span class="legend-dot" style="background: #8b6bb3;"></span> Low Countries</div>
                <div class="legend-item"><span class="legend-dot" style="background: #c44040;"></span> Spain</div>
            </div>
        </div>

        <!-- Books column (right) -->
        <div class="books-column">
            <div class="column-header">
                <h2>Books Printed</h2>
                <div class="subtitle" id="book-count">Loading...</div>
                <div class="filter-info" id="filter-info"></div>
            </div>
            <div class="book-list" id="book-list"></div>
            <div class="load-more" id="load-more" style="display: none;">
                <button id="load-more-btn">Load more books</button>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script>
        let data, books;
        let currentYear = 1454;
        let selectedCity = null;
        let isPlaying = false;
        let playInterval;
        let displayLimit = 50;
        let expandedBook = null;

        const tooltip = d3.select('#tooltip');

        // Initial projection (will be modified by zoom)
        const projection = d3.geoMercator()
            .center([8, 48])
            .scale(1200)
            .translate([300, 250]);

        const cityColors = {
            'Venice': '#e8a838', 'Rome': '#e8a838', 'Milan': '#e8a838',
            'Florence': '#e8a838', 'Bologna': '#e8a838', 'Naples': '#e8a838',
            'Padua': '#e8a838', 'Ferrara': '#e8a838', 'Pavia': '#e8a838',
            'Brescia': '#e8a838', 'Subiaco': '#e8a838',
            'Paris': '#5078a0', 'Lyon': '#5078a0',
            'Mainz': '#5a9e5a', 'Köln': '#5a9e5a', 'Strasbourg': '#5a9e5a',
            'Nürnberg': '#5a9e5a', 'Augsburg': '#5a9e5a', 'Leipzig': '#5a9e5a',
            'Basel': '#5a9e5a', 'Bamberg': '#5a9e5a', 'Speyer': '#5a9e5a',
            'Ulm': '#5a9e5a', 'Lübeck': '#5a9e5a', 'Reutlingen': '#5a9e5a',
            'Wien': '#5a9e5a',
            'Antwerpen': '#8b6bb3', 'Bruges': '#8b6bb3', 'Louvain': '#8b6bb3',
            'Deventer': '#8b6bb3', 'Westminster': '#8b6bb3',
            'Sevilla': '#c44040', 'Barcelona': '#c44040', 'Valencia': '#c44040'
        };

        // Map place names in books to node IDs
        const placeToNodeId = {
            'Venice': 'Venice', 'Venezia': 'Venice',
            'Rome': 'Rome', 'Roma': 'Rome',
            'Milan': 'Milan', 'Milano': 'Milan',
            'Florence': 'Florence', 'Firenze': 'Florence',
            'Bologna': 'Bologna',
            'Naples': 'Naples', 'Napoli': 'Naples',
            'Padua': 'Padua', 'Padova': 'Padua',
            'Ferrara': 'Ferrara',
            'Pavia': 'Pavia',
            'Brescia': 'Brescia',
            'Subiaco': 'Subiaco',
            'Paris': 'Paris',
            'Lyon': 'Lyon', 'Lyons': 'Lyon',
            'Mainz': 'Mainz',
            'Cologne': 'Köln', 'Köln': 'Köln',
            'Strasbourg': 'Strasbourg', 'Strassburg': 'Strasbourg',
            'Nuremberg': 'Nürnberg', 'Nürnberg': 'Nürnberg',
            'Augsburg': 'Augsburg',
            'Leipzig': 'Leipzig',
            'Basel': 'Basel', 'Basle': 'Basel',
            'Bamberg': 'Bamberg',
            'Speyer': 'Speyer', 'Speier': 'Speyer',
            'Ulm': 'Ulm',
            'Lübeck': 'Lübeck', 'Lubeck': 'Lübeck',
            'Reutlingen': 'Reutlingen',
            'Vienna': 'Wien', 'Wien': 'Wien',
            'Antwerp': 'Antwerpen', 'Antwerpen': 'Antwerpen',
            'Bruges': 'Bruges', 'Brugge': 'Bruges',
            'Louvain': 'Louvain', 'Leuven': 'Louvain',
            'Deventer': 'Deventer',
            'Westminster': 'Westminster', 'London': 'Westminster',
            'Seville': 'Sevilla', 'Sevilla': 'Sevilla',
            'Barcelona': 'Barcelona',
            'Valencia': 'Valencia'
        };

        async function init() {
            [data, books] = await Promise.all([
                d3.json('/incunabula_data.json'),
                d3.json('/incunabula_books.json')
            ]);

            const svg = d3.select('#map');
            const mapColumn = document.querySelector('.map-column');
            const width = mapColumn.clientWidth;
            const height = mapColumn.clientHeight - 40; // Account for legend

            svg.attr('width', width).attr('height', height);

            // Update projection for container size
            projection
                .center([8, 48])
                .scale(Math.min(width, height) * 2)
                .translate([width / 2, height / 2]);

            // Add arrowhead markers
            const defs = svg.append('defs');
            defs.append('marker')
                .attr('id', 'arrowhead')
                .attr('viewBox', '0 -5 10 10')
                .attr('refX', 8)
                .attr('refY', 0)
                .attr('markerWidth', 5)
                .attr('markerHeight', 5)
                .attr('orient', 'auto')
                .append('path')
                .attr('d', 'M0,-5L10,0L0,5')
                .attr('fill', '#9e4a3a')
                .attr('opacity', 0.6);

            defs.append('marker')
                .attr('id', 'arrowhead-notable')
                .attr('viewBox', '0 -5 10 10')
                .attr('refX', 8)
                .attr('refY', 0)
                .attr('markerWidth', 5)
                .attr('markerHeight', 5)
                .attr('orient', 'auto')
                .append('path')
                .attr('d', 'M0,-5L10,0L0,5')
                .attr('fill', '#d4a017')
                .attr('opacity', 0.8);

            // Load Europe map
            const europeData = await d3.json('https://raw.githubusercontent.com/leakyMirror/map-of-europe/master/TopoJSON/europe.topojson');
            const path = d3.geoPath().projection(projection);

            // Create main group for zoom
            const g = svg.append('g').attr('class', 'map-group');

            // Draw water background
            g.append('rect')
                .attr('class', 'water')
                .attr('x', -1000)
                .attr('y', -1000)
                .attr('width', 4000)
                .attr('height', 4000)
                .attr('fill', '#dce8f0');

            // Draw countries
            g.append('g')
                .attr('class', 'countries')
                .selectAll('path')
                .data(topojson.feature(europeData, europeData.objects.europe).features)
                .join('path')
                .attr('d', path)
                .attr('fill', '#f5f2ed')
                .attr('stroke', '#d0cbc0')
                .attr('stroke-width', 0.5);

            g.append('g').attr('class', 'connections');
            g.append('g').attr('class', 'cities');

            // Add zoom behavior
            const zoom = d3.zoom()
                .scaleExtent([0.5, 8])
                .on('zoom', (event) => {
                    g.attr('transform', event.transform);
                });

            svg.call(zoom);

            // Event listeners
            document.getElementById('year-slider').addEventListener('input', (e) => {
                currentYear = parseInt(e.target.value);
                update();
            });

            document.getElementById('play-btn').addEventListener('click', togglePlay);
            document.getElementById('reset-btn').addEventListener('click', reset);
            document.getElementById('load-more-btn').addEventListener('click', loadMore);

            // Handle resize
            window.addEventListener('resize', () => {
                const newWidth = mapColumn.clientWidth;
                const newHeight = mapColumn.clientHeight - 40;
                svg.attr('width', newWidth).attr('height', newHeight);
            });

            update();
        }

        function update() {
            document.getElementById('year-display').textContent = currentYear;

            const svg = d3.select('#map');
            const g = svg.select('.map-group');
            const activeCities = data.nodes.filter(n => n.year <= currentYear);
            const activeEdges = data.edges.filter(e => e.year <= currentYear);

            // Stats
            document.getElementById('stat-cities').textContent = activeCities.length;
            document.getElementById('stat-books').textContent =
                books.filter(b => b.year <= currentYear).length.toLocaleString();

            // Render events
            renderEvents(currentYear);

            // Filter books
            let filteredBooks = books.filter(b => b.year <= currentYear);
            if (selectedCity) {
                filteredBooks = filteredBooks.filter(b => {
                    const nodeId = placeToNodeId[b.place] || b.place;
                    return nodeId === selectedCity;
                });
            }

            updateFilterInfo();
            renderBooks(filteredBooks);

            // Draw connections
            const connections = g.select('.connections')
                .selectAll('.connection')
                .data(activeEdges, d => `${d.source}-${d.target}-${d.printer}`);

            const connectionsEnter = connections.enter()
                .append('path')
                .attr('class', d => d.note ? 'connection notable' : 'connection')
                .attr('d', d => {
                    const source = data.nodes.find(n => n.id === d.source);
                    const target = data.nodes.find(n => n.id === d.target);
                    if (!source || !target) return '';
                    const [x1, y1] = projection([source.x, source.y]);
                    const [x2, y2] = projection([target.x, target.y]);
                    const dx = x2 - x1;
                    const dy = y2 - y1;
                    const midX = (x1 + x2) / 2 - dy * 0.15;
                    const midY = (y1 + y2) / 2 + dx * 0.15;
                    return `M ${x1} ${y1} Q ${midX} ${midY} ${x2} ${y2}`;
                })
                .attr('marker-end', d => d.note ? 'url(#arrowhead-notable)' : 'url(#arrowhead)')
                .attr('stroke-opacity', 0);

            connectionsEnter
                .on('mouseover', function(event, d) {
                    d3.select(this).attr('stroke-opacity', 0.9).attr('stroke-width', 3);
                    tooltip.style('visibility', 'visible')
                        .html(`
                            <h3>${d.printer}</h3>
                            <div class="meta">${d.source} → ${d.target} (${d.year})</div>
                            ${d.note ? `<p>${d.note}</p>` : ''}
                        `)
                        .style('left', (event.clientX + 12) + 'px')
                        .style('top', (event.clientY - 10) + 'px');
                })
                .on('mouseout', function(event, d) {
                    d3.select(this)
                        .attr('stroke-opacity', d.note ? 0.7 : 0.25)
                        .attr('stroke-width', d.note ? 2 : 1.5);
                    tooltip.style('visibility', 'hidden');
                });

            connectionsEnter.transition().duration(400)
                .attr('stroke-opacity', d => d.note ? 0.7 : 0.25);

            connections.exit().transition().duration(200)
                .attr('stroke-opacity', 0).remove();

            // Calculate cumulative book counts per city up to current year
            const cityCounts = {};
            books.forEach(b => {
                if (b.year <= currentYear && b.place) {
                    const nodeId = placeToNodeId[b.place] || b.place;
                    cityCounts[nodeId] = (cityCounts[nodeId] || 0) + 1;
                }
            });

            // Helper to get radius from count
            const getRadius = (count) => Math.sqrt(count || 1) / 3 + 3;

            // Draw cities using join pattern for proper enter/update/exit
            const cityGroups = g.select('.cities')
                .selectAll('.city-group')
                .data(activeCities, d => d.id);

            // Exit
            cityGroups.exit().transition().duration(200)
                .style('opacity', 0).remove();

            // Enter
            const cityEnter = cityGroups.enter()
                .append('g')
                .attr('class', 'city-group')
                .attr('transform', d => {
                    const [x, y] = projection([d.x, d.y]);
                    return `translate(${x}, ${y})`;
                })
                .style('opacity', 0);

            cityEnter.append('circle')
                .attr('class', 'city-node')
                .attr('fill', d => cityColors[d.id] || '#9e4a3a')
                .attr('stroke', '#fff')
                .attr('stroke-width', 1.5);

            cityEnter.append('text')
                .attr('class', 'city-label')
                .attr('text-anchor', 'middle')
                .text(d => d.id);

            cityEnter.transition().duration(400).style('opacity', 1);

            // Update ALL cities (enter + existing) with current counts
            const allCities = g.select('.cities').selectAll('.city-group');

            allCities.each(function(d) {
                const count = cityCounts[d.id] || 0;
                const radius = getRadius(count);

                d3.select(this).select('.city-node')
                    .transition().duration(150)
                    .attr('r', radius);

                d3.select(this).select('.city-label')
                    .transition().duration(150)
                    .attr('y', -radius - 4);

                // Store count for tooltip
                d.currentCount = count;
            });

            // Re-bindtooltip events (need fresh data)
            allCities.select('.city-node')
                .on('mouseover', function(event, d) {
                    const count = cityCounts[d.id] || 0;
                    tooltip.style('visibility', 'visible')
                        .html(`
                            <h3>${d.id}</h3>
                            <div class="meta">First press: ${d.year}</div>
                            <p><strong>${count.toLocaleString()}</strong> books by ${currentYear}</p>
                            <p style="font-size:10px;color:#888;">${d.count.toLocaleString()} total by 1500</p>
                            <div class="click-hint">Click to filter books</div>
                        `)
                        .style('left', (event.clientX + 12) + 'px')
                        .style('top', (event.clientY - 10) + 'px');
                })
                .on('mouseout', () => tooltip.style('visibility', 'hidden'))
                .on('click', function(event, d) {
                    event.stopPropagation();
                    selectCity(d.id);
                });

            allCities.select('.city-node')
                .classed('selected', d => d.id === selectedCity);
        }

        function renderEvents(year) {
            const eventsList = document.getElementById('events-list');

            // Show all events up to current year, most recent first
            const allEvents = data.events.filter(e => e.year <= year).sort((a, b) => b.year - a.year);

            if (allEvents.length === 0) {
                eventsList.innerHTML = '<div class="no-events">No events yet. Move the timeline forward.</div>';
                return;
            }

            const html = allEvents.map(event => {
                const isCurrent = event.year === year;
                const isRecent = event.year >= year - 2;
                const className = isCurrent ? 'current' : (isRecent ? '' : 'faded');
                return `
                    <div class="event-item ${className}">
                        <div class="event-header">
                            <span class="event-year">${event.year}</span>
                            <span class="event-title">${event.title}</span>
                            <span class="event-type ${event.type}">${event.type}</span>
                        </div>
                        <div class="event-desc">${event.desc}</div>
                    </div>
                `;
            }).join('');

            eventsList.innerHTML = html;

            // Scroll to top (most recent) if playing
            if (isPlaying) {
                eventsList.scrollTop = 0;
            }
        }

        function selectCity(cityId) {
            selectedCity = selectedCity === cityId ? null : cityId;
            displayLimit = 50;
            update();
        }

        function updateFilterInfo() {
            const container = document.getElementById('filter-info');
            container.innerHTML = '';
            if (selectedCity) {
                const tag = document.createElement('div');
                tag.className = 'filter-tag';
                tag.innerHTML = `${selectedCity} <button onclick="clearFilter()">&times;</button>`;
                container.appendChild(tag);
            }
        }

        function clearFilter() {
            selectedCity = null;
            displayLimit = 50;
            update();
        }

        function renderBooks(filteredBooks) {
            const container = document.getElementById('book-list');
            const countEl = document.getElementById('book-count');
            const loadMoreEl = document.getElementById('load-more');

            const displayBooks = filteredBooks.slice(0, displayLimit);
            const hasMore = filteredBooks.length > displayLimit;

            countEl.textContent = `${filteredBooks.length.toLocaleString()} books${selectedCity ? ' in ' + selectedCity : ''} by ${currentYear}`;

            if (displayBooks.length === 0) {
                container.innerHTML = '<div class="no-books">No books yet. Move the timeline forward.</div>';
                loadMoreEl.style.display = 'none';
                return;
            }

            container.innerHTML = displayBooks.map(book => `
                <div class="book-item${book.year === currentYear ? ' highlighted' : ''}${expandedBook === book.id ? ' expanded' : ''}"
                     data-id="${book.id}" onclick="toggleBook('${book.id}')">
                    <div class="year-city">
                        ${book.year} · ${book.place || 'Unknown'}
                        ${book.digital_links && book.digital_links.length > 0 ? `<span class="digital-indicator">📄 ${book.digital_links.length}</span>` : ''}
                    </div>
                    <div class="title">${book.title}</div>
                    <div class="meta">${book.printer || 'Unknown printer'}${book.holdings_count ? ` · ${book.holdings_count} copies` : ''}</div>
                    ${expandedBook === book.id ? `<div class="book-details" id="details-${book.id}"></div>` : ''}
                </div>
            `).join('');

            loadMoreEl.style.display = hasMore ? 'block' : 'none';

            if (expandedBook) {
                renderBookDetails(expandedBook);
            }
        }

        function toggleBook(bookId) {
            expandedBook = expandedBook === bookId ? null : bookId;
            update();
        }

        function renderBookDetails(bookId) {
            const detailsEl = document.getElementById(`details-${bookId}`);
            if (!detailsEl) return;

            const book = books.find(b => b.id === bookId);
            if (!book) {
                detailsEl.innerHTML = `<a class="istc-link" href="https://data.cerl.org/istc/${bookId}" target="_blank">View in ISTC →</a>`;
                return;
            }

            const digitalLinks = book.digital_links || [];
            let html = '';

            if (book.summary) {
                html += `<div class="book-summary">${book.summary}</div>`;
            }

            if (digitalLinks.length > 0) {
                html += '<div class="digital-links">';
                digitalLinks.slice(0, 3).forEach(link => {
                    html += `<a class="digital-link" href="${link.url}" target="_blank">${link.name}</a>`;
                });
                if (digitalLinks.length > 3) {
                    html += `<div class="more-links">+${digitalLinks.length - 3} more</div>`;
                }
                html += '</div>';
            } else {
                html += '<div class="no-digital">No digital copy available</div>';
            }

            if (book.holdings_count > 0) {
                html += `<div class="holdings-info">Held by ${book.holdings_count} institution${book.holdings_count > 1 ? 's' : ''}</div>`;
            }

            html += `<a class="istc-link" href="https://data.cerl.org/istc/${bookId}" target="_blank">View full record →</a>`;

            detailsEl.innerHTML = html;
        }

        function loadMore() {
            displayLimit += 50;
            update();
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                clearInterval(playInterval);
                btn.innerHTML = '▶ Play';
                btn.classList.remove('active');
            } else {
                if (currentYear >= 1500) {
                    currentYear = 1454;
                    document.getElementById('year-slider').value = 1454;
                }
                btn.innerHTML = '⏸ Pause';
                btn.classList.add('active');
                playInterval = setInterval(() => {
                    currentYear++;
                    if (currentYear > 1500) {
                        togglePlay();
                        return;
                    }
                    document.getElementById('year-slider').value = currentYear;
                    update();
                }, 200);
            }
            isPlaying = !isPlaying;
        }

        function reset() {
            if (isPlaying) togglePlay();
            currentYear = 1454;
            selectedCity = null;
            displayLimit = 50;
            document.getElementById('year-slider').value = 1454;
            update();
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.city-node') && !e.target.closest('.books-column') && !e.target.closest('.filter-tag')) {
                if (selectedCity) {
                    selectedCity = null;
                    displayLimit = 50;
                    update();
                }
            }
        });

        init();
    </script>
</body>
</html>
